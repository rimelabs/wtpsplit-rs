[package]
name = "wtpsplit"
version = "0.1.0"
edition = "2021"
description = "Rust port of wtpsplit - Universal sentence and paragraph segmentation"
license = "MIT"
repository = "https://github.com/segment-any-text/wtpsplit"
keywords = ["nlp", "sentence-segmentation", "tokenization", "onnx"]
categories = ["text-processing", "science"]

[dependencies]
# ONNX Runtime (match rime's ort for compatibility)
ort = { version = "2.0.0-rc.11", features = ["load-dynamic", "half"] }

# HuggingFace tokenizers (native Rust)
tokenizers = "0.21"

# Array operations (match rime's ndarray so ort's trait impl matches)
ndarray = "0.17"
half = { version = "2.4", features = ["num-traits"] }

# HuggingFace Hub for model downloading
hf-hub = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Progress bars
indicatif = "0.17"

# Parallelization
rayon = "1.10"

# CSV parsing for language info
csv = "1.3"

# Lazy static for constants
once_cell = "1.20"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[[example]]
name = "split"
path = "examples/split.rs"

[[bench]]
name = "benchmark"
harness = false

[features]
default = []
cuda = []
